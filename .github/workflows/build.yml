name: Windows build and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and test
        shell: pwsh
        run: ./Build.ps1 -PrepareVoice -SkipInstaller
      - uses: actions/upload-artifact@v4
        with:
          name: Batto-Stream-Deck-Plugin-CI
          path: |
            dist/Extras/de.crazybatto.suite.streamDeckPlugin
          retention-days: 14
      # Protected Windows installers are built and released locally.
      # The installer key must never be added to repository files or GitHub secrets.
