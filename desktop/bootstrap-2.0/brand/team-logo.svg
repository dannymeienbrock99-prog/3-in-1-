<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Team Alpha – Crazy_Batto</title>
  <desc id="desc">Elektrisches Team-Alpha-Emblem mit weißem Drachen, PC-Schild und Blitz.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#111b35"/><stop offset="1" stop-color="#2c0d19"/></linearGradient>
