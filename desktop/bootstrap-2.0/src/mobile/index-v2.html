<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#080d15">
  <title>Batto OBS Tool Mobile</title>
  <link rel="stylesheet" href="./styles-v2.css">
</head>
<body>
  <header>
    <img src="../stream-overlay/team-logo.svg" alt="Team Alpha">
    <div><strong>Batto OBS Tool</strong><small id="status" data-kind="pending">Verbindung wird hergestellt …</small></div>
    <button id="refresh" type="button">↻</button>
  </header>
  <main>
    <section class="toolbar">
      <label>Profil<select id="profile-select"></select></label>
      <div class="folder"><button id="folder-back" type="button" hidden>←</button><strong id="folder-title">Hauptseite</strong></div>
    </section>
    <section id="deck" class="deck" aria-label="Touch-Deck"></section>
    <section class="obs-panel">
      <div class="obs-head"><strong>OBS-Steuerung</strong><span id="obs-state" data-kind="error">OBS getrennt</span></div>
      <label>Szene<select id="scene-select"></select></label>
      <button id="scene-switch" type="button">Szene schalten</button>
      <div class="obs-buttons"><button id="stream-toggle" type="button">Stream</button><button id="record-toggle" type="button">Aufnahme</button><button id="virtualcam-toggle" type="button">Kamera</button></div>
    </section>
  </main>
  <output id="toast" aria-live="polite"></output>
  <script src="./app-v2.js"></script>
</body>
</html>
