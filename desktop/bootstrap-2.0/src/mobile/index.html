<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#07111d">
  <title>Batto OBS Tool – Handy</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-mark">⚡</div>
    <div>
      <strong>Batto OBS Tool</strong>
      <small id="connection-label">Nicht verbunden</small>
    </div>
    <button id="settings-button" class="icon-button" type="button" aria-label="Verbindung">⚙</button>
  </header>

  <main>
    <section id="pair-panel" class="panel pair-panel">
      <span class="eyebrow">Lokale Verbindung</span>
      <h1>Mit dem PC koppeln</h1>
      <p>PC und Handy müssen sich im selben lokalen Netzwerk befinden.</p>
      <label>PC-Adresse<input id="host-input" autocomplete="off" inputmode="url" placeholder="192.168.1.10"></label>
      <label>Port<input id="port-input" inputmode="numeric" value="48620"></label>
      <label>Sechsstellige PIN<input id="pin-input" inputmode="numeric" maxlength="6" placeholder="000000"></label>
      <label>Gerätename<input id="name-input" maxlength="80" value="Mein Handy"></label>
      <button id="pair-button" class="primary" type="button">Koppeln</button>
      <output id="pair-status" class="status"></output>
    </section>

    <section id="control-panel" hidden>
      <nav class="mobile-tabs">
        <button class="active" data-page="deck" type="button">Touch-Deck</button>
        <button data-page="obs" type="button">OBS</button>
        <button data-page="status" type="button">Status</button>
      </nav>

      <section class="mobile-page active" data-page-panel="deck">
        <div class="deck-toolbar">
          <select id="profile-select" aria-label="Profil"></select>
          <button id="folder-back" type="button">← Zurück</button>
        </div>
        <div id="folder-title" class="folder-title"></div>
        <div id="deck-grid" class="deck-grid"></div>
      </section>

      <section class="mobile-page" data-page-panel="obs">
        <div class="panel">
          <h2>OBS-Steuerung</h2>
          <select id="scene-select" aria-label="OBS-Szene"></select>
          <div class="control-grid">
            <button data-action="obs.stream.toggle" type="button">Stream Start/Stop</button>
            <button data-action="obs.record.toggle" type="button">Aufnahme Start/Stop</button>
            <button data-action="obs.virtualcam.toggle" type="button">Virtuelle Kamera</button>
            <button id="refresh-button" type="button">Neu laden</button>
          </div>
          <div id="audio-list" class="audio-list"></div>
        </div>
      </section>

      <section class="mobile-page" data-page-panel="status">
        <div class="panel">
          <h2>PC-Status</h2>
          <dl id="status-list"></dl>
          <button id="disconnect-button" class="danger" type="button">Verbindung trennen</button>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="./app.js"></script>
</body>
</html>
