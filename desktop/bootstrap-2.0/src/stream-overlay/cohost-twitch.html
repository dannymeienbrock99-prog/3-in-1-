<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#grid{width:100%;height:100%;display:grid;gap:8px;padding:8px;box-sizing:border-box}.slot{position:relative;overflow:hidden;background:rgba(8,12,18,.35);border-radius:18px}.slot iframe{width:100%;height:100%;border:0;background:transparent}.empty{display:grid;place-items:center;color:rgba(255,255,255,.45);font:600 28px system-ui}</style></head><body><div id="grid"></div><script>(()=>{const q=new URLSearchParams(location.search);const n=Math.max(1,Math.min(8,Number(q.get('slots'))||4));const cols=n<=1?1:n<=4?2:Math.ceil(Math.sqrt(n));const rows=Math.ceil(n/cols);const g=document.getElementById('grid');g.style.gridTemplateColumns=`repeat(${cols},1fr)`;g.style.gridTemplateRows=`repeat(${rows},1fr)`;for(let i=1;i<=n;i++){const s=document.createElement('div');s.className='slot';const u=q.get(`u${i}`);if(u){const f=document.createElement('iframe');f.src=u;f.allow='autoplay; microphone; camera';s.appendChild(f)}else{s.classList.add('empty');s.textContent=`Gast ${i}`}g.appendChild(s)}})();</script></body></html>
