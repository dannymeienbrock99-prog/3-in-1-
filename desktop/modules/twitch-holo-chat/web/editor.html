<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Batto OBS Tool – Twitch-Hologramm</title>
  <link rel="stylesheet" href="./editor.css">
</head>
<body>
  <main class="holo-settings-shell">
    <header class="holo-header">
      <div><span class="eyebrow">TWITCH-HOLOGRAMM</span><h1>Chat-Namen und Nachrichten gestalten</h1><p>Direkte OBS-Einstellung für Benutzername, Chat-Nachricht, Schriftart, Farben, Glow und Animation.</p></div>
      <div class="holo-badges"><span>Name</span><span>Nachricht</span><span>OBS</span></div>
    </header>

    <div class="holo-grid">
      <section class="editor-controls">
        <section class="control-section accent">
          <h2>Anzeige</h2>
          <label class="check-row"><input id="effect-enabled" type="checkbox" checked><span>Hologramm aktiv</span></label>
          <label class="check-row"><input id="effect-name" type="checkbox" checked><span>Benutzername gestalten</span></label>
          <label class="check-row"><input id="effect-message" type="checkbox" checked><span>Chat-Nachricht gestalten</span></label>
          <label class="check-row"><input id="transparent-bubbles" type="checkbox"><span>Nur Schrift · keine Sprechblase</span></label>
          <label class="check-row"><input id="reduced-motion" type="checkbox"><span>Weniger Animation</span></label>
        </section>

        <section class="control-section">
          <h2>Zuweisung</h2>
          <label>Stil für<select id="style-target"><option value="broadcaster">Streamer</option><option value="moderator">Moderator</option><option value="vip">VIP</option><option value="subscriber">Abonnent</option><option value="viewer">Zuschauer</option><option value="user">Bestimmter Twitch-Name</option></select></label>
          <label id="user-name-row" hidden>Twitch-Name<input id="user-name" type="text" maxlength="80" placeholder="z. B. crazy_batto" autocomplete="off"></label>
        </section>

        <section class="control-section">
          <h2>Hologramm-Farben</h2>
          <div class="color-grid">
            <label>1<input id="color-1" type="color" value="#54f4ff"></label><label>2<input id="color-2" type="color" value="#9867ff"></label><label>3<input id="color-3" type="color" value="#ff55c8"></label><label>4<input id="color-4" type="color" value="#ffe66d"></label><label>5<input id="color-5" type="color" value="#54f4ff"></label><label>6<input id="color-6" type="color" value="#9867ff"></label>
          </div>
          <label>Aktive Farben<select id="color-count"><option value="2">2</option><option value="3">3</option><option value="4" selected>4</option><option value="5">5</option><option value="6">6</option></select></label>
          <label>Farbwinkel<span class="range-row"><input id="angle" type="range" min="0" max="360" step="1" value="110"><output id="angle-value">110°</output></span></label>
          <label>Animation<span class="range-row"><input id="speed" type="range" min="0.6" max="15" step="0.1" value="4.5"><output id="speed-value">4,5 s</output></span></label>
          <label>Glow<span class="range-row"><input id="glow" type="range" min="0" max="50" step="1" value="18"><output id="glow-value">18 px</output></span></label>
          <label>Helligkeit<span class="range-row"><input id="brightness" type="range" min="0.5" max="2" step="0.05" value="1.15"><output id="brightness-value">115 %</output></span></label>
          <label>Sättigung<span class="range-row"><input id="saturation" type="range" min="0" max="3" step="0.05" value="1.2"><output id="saturation-value">120 %</output></span></label>
        </section>

        <section class="control-section">
          <h2>Vorlagen</h2>
          <div class="button-row presets"><button type="button" data-preset="discord-like">Hologramm</button><button type="button" data-preset="cyan-purple">Cyan–Lila</button><button type="button" data-preset="gold">Gold</button><button type="button" data-preset="red-gold">Rot–Gold</button><button type="button" data-preset="green-cyan">Grün–Cyan</button></div>
        </section>

        <section class="control-section save-box">
          <h2>Speichern</h2>
          <div class="button-row"><button id="save-style" class="primary" type="button">Übernehmen</button><button id="remove-user-style" class="danger" type="button" hidden>Benutzerstil entfernen</button><button id="export-config" type="button">Konfiguration kopieren</button></div>
          <output id="editor-status" class="status" aria-live="polite"></output>
        </section>
      </section>

      <section class="editor-preview">
        <header class="preview-toolbar"><div><span class="eyebrow">LIVE-VORSCHAU</span><strong>So erscheint der Chat in OBS</strong></div><div class="button-row"><button id="preview-streamer" type="button">Streamer</button><button id="preview-mod" type="button">Moderator</button><button id="preview-viewer" type="button">Zuschauer</button><button id="preview-clear" type="button">Leeren</button></div></header>
        <iframe id="preview-frame" class="preview-frame" src="./overlay.html" title="Twitch-Hologramm Vorschau" sandbox="allow-scripts allow-same-origin"></iframe>
      </section>
    </div>
  </main>
  <script src="./editor.js"></script>
  <script src="./font-editor-addon.js"></script>
</body>
</html>
